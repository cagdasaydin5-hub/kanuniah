name: Testler

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Veri dosyalarını denetle
        run: python3 tools/validate.py
      - name: İlaç etkileşimi aracı testleri
        run: node --test tools/etkilesim/test_etkilesim.js
