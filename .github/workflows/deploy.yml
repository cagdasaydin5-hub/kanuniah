name: Siteyi yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      # Haftalık içerik (rehberler, makaleler, etkinlikler, meta) artık sunucuda /admin/guncelle.php ile yazılır.
      # Depodaki eski kopyası canlı sürümün üzerine yazılmasın diye bu dosyaları değiştiren gönderim yayınlanmaz.
      - name: Haftalık içerik dosyaları depodan yüklenmesin
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          git fetch -q --depth=1 origin "${{ github.event.before }}" || exit 0
          if git diff --name-only "${{ github.event.before }}" HEAD | grep -E '^data/(rehberler|makaleler|etkinlikler|meta)\.json$'; then
            echo "::error::Bu dosyalar canlı sitede /admin/guncelle.php ile güncelleniyor; depodan yüklenirse canlı içerik eskir. Değişikliği uç nokta üzerinden yapın."
            exit 1
          fi

      - name: Araç dizini ve service worker'ı üret
        run: python3 tools/build_pwa.py

      - name: Veri dosyalarını denetle
        run: python3 tools/validate.py

      - name: Araç hesaplarını test et
        run: node --test

      - name: FTP bilgileri henüz tanımlı değil
        if: env.FTP_SERVER == ''
        run: echo "FTP secret'ları tanımlanmadığı için yükleme atlandı. README'deki adımlara bakın."

      - name: FTP ile yükle
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tools/**
            tests/**
            README.md
