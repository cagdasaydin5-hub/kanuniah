name: Siteyi yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - name: Araç dizini ve service worker'ı üret
        run: python3 tools/build_pwa.py

      - name: Veri dosyalarını denetle
        run: python3 tools/validate.py

      - name: Araç hesaplarını test et
        run: node --test

      - name: FTP bilgileri henüz tanımlı değil
        if: env.FTP_SERVER == ''
        run: echo "FTP secret'ları tanımlanmadığı için yükleme atlandı. README'deki adımlara bakın."

      - name: FTP ile yükle
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tools/**
            tests/**
            README.md
